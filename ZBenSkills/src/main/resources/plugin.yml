name: ZBenSkills
version: 1.0.0
main: com.zbennoz.zbenskills.ZBenSkillsPlugin
api-version: "1.21"
authors:
  - ZBenNoZ
description: Progression heavy skill system with trees, achievements and prestige.
commands:
  skills:
    description: Skillmenü und Infos öffnen.
    usage: /skills [challenges|achievements|prestige|info|reload]
    aliases: [skill, ability]
permissions:
  zbenskills.use:
    default: true
    description: Erlaubt Zugriff auf das Skill-Menü und Skill-Infos.
  zbenskills.admin:
    default: op
    description: Erlaubt das Neuladen der Config.
