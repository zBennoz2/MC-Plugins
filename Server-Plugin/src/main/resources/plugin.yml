name: ZBenCityJobs
version: 0.1.0
main: com.zbennoz.zbencityjobs.ZBenCityJobs
api-version: "1.21"
author: ZBenNoZ
description: Marketplace, jobs, companies and cities with escrow protection.
softdepend:
  - Vault
commands:
  jobs:
    description: Manage jobs and open the job board.
    usage: /jobs
    permission: zbencityjobs.jobs
  market:
    description: Open the marketplace GUI.
    usage: /market
    permission: zbencityjobs.market
  company:
    description: Manage companies.
    usage: /company
    permission: zbencityjobs.company
  city:
    description: City administration commands.
    usage: /city
    permission: zbencityjobs.city
permissions:
  zbencityjobs.admin:
    default: op
    children:
      zbencityjobs.jobs.*: true
      zbencityjobs.market.*: true
      zbencityjobs.company.*: true
      zbencityjobs.city.*: true
  zbencityjobs.jobs:
    default: true
  zbencityjobs.jobs.create:
    default: true
  zbencityjobs.jobs.list:
    default: true
  zbencityjobs.jobs.take:
    default: true
  zbencityjobs.jobs.submit:
    default: true
  zbencityjobs.jobs.cancel:
    default: true
  zbencityjobs.market:
    default: true
  zbencityjobs.market.sell:
    default: true
  zbencityjobs.market.buy:
    default: true
  zbencityjobs.company:
    default: true
  zbencityjobs.company.manage:
    default: op
  zbencityjobs.city:
    default: op
  zbencityjobs.city.admin:
    default: op
