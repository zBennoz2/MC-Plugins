# ZBenCityJobs configuration
coins:
  starting-balance: 0
  currency-name: "ZBenCoins"
  currency-symbol: "⛃"
  allow-negative: false
  transaction-log: true
  max-amount: 1000000000

storage:
  database: cityjobs.db
  use-wal: true
  async-writes: true

economy:
  escrow-required: true
  escrow-account: server
  tax-default-percent: 5.0

company:
  creation-cost: 0

city:
  creation-cost: 0

logging:
  debug: false

gui:
  job-board-size: 54
  market-size: 54
