tab:
  branding:
    enabled: true
logging:
  blocks:
    enabled: true
  containers:
    enabled: true
  debug: false
  maxRowsPerQuery: 10
inspector:
  maxEntries: 20
adminmode:
  enableFly: true
  nightVision: true
  invisibility: true
ranks:
  defaultRank: Stammspieler
suspiciousMining:
  enabled: true
  windowSeconds: 300
  thresholds:
    DIAMOND_ORE: 12
    DEEPSLATE_DIAMOND_ORE: 12
    ANCIENT_DEBRIS: 6
    EMERALD_ORE: 10
  minY:
    DIAMOND_ORE: 40
    DEEPSLATE_DIAMOND_ORE: 10
