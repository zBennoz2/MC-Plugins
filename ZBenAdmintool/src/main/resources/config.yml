  staffNotifyPermission: "admintool.alerts"
  storeEventsDays: 14
  ignoreCreative: true
  ignoreOperators: true
oreVision:
  enabled: true
  radius: 20
  scanIntervalTicks: 20
  maxBlocksPerScan: 12000
  ores:
    - DIAMOND_ORE
    - DEEPSLATE_DIAMOND_ORE
    - ANCIENT_DEBRIS
    - EMERALD_ORE
    - GOLD_ORE
    - DEEPSLATE_GOLD_ORE
  particlesEnabled: true
